services:
    solid-fullstack-template-postgres:
        image: postgres:17
        container_name: solid-fullstack-template-postgres
        environment:
            POSTGRES_DB: SolidFullstackTemplate
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d SolidFullstackTemplate"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s

volumes:
    postgres-data:
